<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seat Booking System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    padding:20px;
    color:#333;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.screen{
    max-width:900px;
    margin:0 auto 30px;
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:14px;
    border-radius:12px;
    letter-spacing:2px;
    font-weight:bold;
}

.container{
    display:flex;
    gap:30px;
    align-items:flex-start;
    max-width:1400px;
    margin:auto;
}

.seat-area{
    flex:2;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    overflow:auto;
}

.form-area{
    flex:1;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    position:sticky;
    top:20px;
}

.form-area h2{
    margin-bottom:20px;
}

.legend{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
}

.legend-box{
    width:20px;
    height:20px;
    border-radius:4px;
}

.available-box{
    background:#cfd8dc;
}

.selected-box{
    background:#2ecc71;
}

.booked-box{
    background:#e74c3c;
}

.row{
    display:flex;
    align-items:center;
    margin-bottom:10px;
}

.row-label{
    width:40px;
    font-weight:bold;
    text-align:center;
}

.section{
    display:flex;
    gap:6px;
}

.aisle{
    width:40px;
}

.seat{
    width:42px;
    height:42px;
    border:none;
    border-radius:8px;
    background:#cfd8dc;
    cursor:pointer;
    transition:0.2s;
    font-size:11px;
    font-weight:bold;
}

.seat:hover{
    transform:scale(1.08);
    background:#90caf9;
}

.selected{
    background:#2ecc71 !important;
    color:white;
}

.booked{
    background:#e74c3c !important;
    color:white;
    cursor:not-allowed;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#3498db;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#2980b9;
}

#status{
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
}

.total-seat{
    margin-bottom:20px;
    font-weight:bold;
}

/* SEARCH TICKET */

.search-ticket{
    max-width:1400px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.search-ticket h2{
    margin-bottom:15px;
}

.search-box{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    align-items:center;
}

.search-box input{
    width:100%;
    flex:1;
    margin-bottom:0;
    padding:14px 18px;
    font-size:16px;
}

.search-box button{
    width:500px;
    min-width:500px;
}

.ticket-card{
    border:2px dashed #3498db;
    border-radius:15px;
    padding:20px;
    margin-top:15px;
    background:#f8fbff;
}

.ticket-title{
    font-size:24px;
    font-weight:bold;
    color:#3498db;
    margin-bottom:15px;
}

.ticket-item{
    margin-bottom:10px;
    font-size:16px;
}

.ticket-seat{
    font-size:32px;
    color:#e74c3c;
    font-weight:bold;
    margin-top:15px;
}

@media(max-width:1000px){

.container{
    flex-direction:column;
}

.form-area{
    width:100%;
    position:relative;
}

.search-box{
    flex-direction:column;
}

}

</style>
</head>

<body>

<h1>Seat Booking System PENSI IPEKA Pluit Christian School</h1>

<div class="screen">
STAGE / SCREEN
</div>

<div class="container">

<div class="seat-area">

<div class="legend">

<div class="legend-item">
<div class="legend-box available-box"></div>
Available
</div>

<div class="legend-item">
<div class="legend-box selected-box"></div>
Selected
</div>

<div class="legend-item">
<div class="legend-box booked-box"></div>
Booked
</div>

</div>

<div class="total-seat">
Total Seat: 160
</div>

<div id="seatArea"></div>

</div>

<div class="form-area">

<h2>Booking Ticket</h2>

<input type="text" id="name" placeholder="Nama Lengkap">

<input type="email" id="email" placeholder="Email Pemesan">

<input type="text" id="seatCode" placeholder="Kode Kursi" readonly>

<button onclick="bookSeat()">
Booking Seat
</button>

<p id="status"></p>

</div>

</div>

<!-- SEARCH TICKET -->

<div class="search-ticket">

<h2>Cari E-Ticket</h2>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Cari Nama / Booking ID / Seat">

<button onclick="searchTicket()">
Cari Ticket
</button>

</div>

<div id="ticketResult"></div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby5_wasKXC7kVfbaSyQtyi5Zsxun-7vCMX-rPltEy9BqMbvlsKyOvSeDtzjL-BgqaV_fw/exec";

const seatArea = document.getElementById("seatArea");

const rows = 10;

const layout = {
    left:4,
    center:8,
    right:4
};

let selectedSeatElement = null;
let selectedSeatCode = null;

function generateSeats(){

    for(let r=1; r<=rows; r++){

        const rowDiv = document.createElement("div");
        rowDiv.className = "row";

        const rowLabel = document.createElement("div");
        rowLabel.className = "row-label";
        rowLabel.innerText = String.fromCharCode(64+r);

        rowDiv.appendChild(rowLabel);

        createSection(rowDiv, "L", layout.left, r);

        const aisle1 = document.createElement("div");
        aisle1.className = "aisle";
        rowDiv.appendChild(aisle1);

        createSection(rowDiv, "C", layout.center, r);

        const aisle2 = document.createElement("div");
        aisle2.className = "aisle";
        rowDiv.appendChild(aisle2);

        createSection(rowDiv, "R", layout.right, r);

        seatArea.appendChild(rowDiv);
    }
}

function createSection(parent, prefix, total, row){

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    let prefixMap = {
        L: "A",
        C: "B",
        R: "C"
    };

    for(let i=1; i<=total; i++){

        const seat = document.createElement("button");

        const rowLetter = String.fromCharCode(64+row);

        const seatCode = `${rowLetter}-${prefixMap[prefix]}${i}`;

        seat.className = "seat";
        seat.dataset.code = seatCode;
        seat.innerText = seatCode;

        seat.onclick = () => selectSeat(seat, seatCode);

        sectionDiv.appendChild(seat);
    }

    parent.appendChild(sectionDiv);
}

function selectSeat(element, code){

    if(element.classList.contains("booked")) return;

    document.querySelectorAll(".seat").forEach(seat=>{
        seat.classList.remove("selected");
    });

    element.classList.add("selected");

    selectedSeatElement = element;
    selectedSeatCode = code;

    document.getElementById("seatCode").value = code;
}

async function bookSeat(){

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();

    if(!name || !email || !selectedSeatCode){

        alert("Lengkapi data dan pilih seat!");
        return;
    }

    const data = {
    action:"seat",
    name:name,
    email:email,
    seat:selectedSeatCode
};

    document.getElementById("status").innerText =
    "Mengirim booking...";

    try{

        const response = await fetch("https://script.google.com/macros/s/AKfycby5_wasKXC7kVfbaSyQtyi5Zsxun-7vCMX-rPltEy9BqMbvlsKyOvSeDtzjL-BgqaV_fw/exec",{
            method:"POST",
            body:JSON.stringify(data)
        });

        const result = await response.json();

        document.getElementById("status").innerText =
        result.message;

        if(!result.success){
            return;
        }

        selectedSeatElement.classList.remove("selected");
        selectedSeatElement.classList.add("booked");

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("seatCode").value = "";

        selectedSeatElement = null;
        selectedSeatCode = null;

    }catch(err){

        console.log(err);

        document.getElementById("status").innerText =
        "Gagal booking";

    }

}

async function loadBookedSeats(){

    try{

        const response = await fetch("https://script.google.com/macros/s/AKfycby5_wasKXC7kVfbaSyQtyi5Zsxun-7vCMX-rPltEy9BqMbvlsKyOvSeDtzjL-BgqaV_fw/exec");

        const bookedSeats = await response.json();

        bookedSeats.forEach(code=>{

            const seat = document.querySelector(
                `[data-code="${code}"]`
            );

            if(seat){

                seat.classList.add("booked");

            }

        });

    }catch(err){

        console.log(err);

    }

}

async function searchTicket(){

    const keyword =
    document.getElementById("searchInput")
    .value
    .trim();

    if(!keyword){

        alert("Masukkan nama / booking ID / seat");
        return;

    }

    try{

        const response = await fetch(
        "https://script.google.com/macros/s/AKfycbwVYE6Kjym7mnPm9125ao-lrFs5FCJUmxfDNyl-n5ThGzaw6p-bG2gc_TG7uNdYm3R16A/exec" +
        "?search=" +
        encodeURIComponent(keyword)
        );

        const result = await response.json();

        const ticketResult =
        document.getElementById("ticketResult");

        ticketResult.innerHTML = "";

        if(result.length === 0){

            ticketResult.innerHTML = `
            <div class="ticket-card">
                Ticket tidak ditemukan
            </div>
            `;

            return;

        }

        result.forEach(ticket=>{

            ticketResult.innerHTML += `

            <div class="ticket-card">

                <div class="ticket-title">
                    E-Ticket Booking
                </div>

                <div class="ticket-item">
                    <b>Booking ID:</b>
                    ${ticket.bookingId}
                </div>

                <div class="ticket-item">
                    <b>Nama:</b>
                    ${ticket.name}
                </div>

                <div class="ticket-item">
                    <b>Email:</b>
                    ${ticket.email}
                </div>

                <div class="ticket-item">
                    <b>Status:</b>
                    ${ticket.status}
                </div>

                <div class="ticket-seat">
                    ${ticket.seat}
                </div>

            </div>

            `;

        });

    }catch(err){

        console.log(err);

        alert("Gagal mengambil ticket");

    }

}

generateSeats();
loadBookedSeats();

</script>

</body>
</html>
