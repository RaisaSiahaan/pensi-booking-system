<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seat Booking System</title>

<style>

:root{
    --ipeka-blue:#0057b8;
    --ipeka-light:#0d7be0;
    --ipeka-gold:#f4b400;
    --ipeka-orange:#f57c00;
    --ipeka-bg:#eef4fb;
    --ipeka-card:#ffffff;
    --ipeka-text:#1f2937;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:var(--ipeka-bg);
    padding:20px;
    color:var(--ipeka-text);
    position:relative;
    overflow-x:hidden;
}

/* BACKGROUND WATERMARK */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:
    url("IPEKA.png");

    background-size:120px;

    background-repeat:repeat;

    opacity:0.035;

    transform:rotate(-18deg) scale(1.2);

    z-index:-2;
}

/* TOP LOGO */

.top-logo{
    position:fixed;
    top:18px;
    left:18px;
    z-index:999;
}

.top-logo img{

    width:75px;

    background:white;

    padding:8px;

    border-radius:18px;

    box-shadow:
    0 10px 30px rgba(0,87,184,0.18);

    border:2px solid rgba(255,255,255,0.9);

    backdrop-filter:blur(8px);
}

/* TITLE */

h1{

    text-align:center;

    margin-bottom:20px;

    color:var(--ipeka-blue);

    font-size:36px;

    font-weight:800;

    letter-spacing:0.5px;

    line-height:1.3;
}

/* SCREEN */

.screen{

    max-width:900px;

    margin:0 auto 35px;

    background:
    linear-gradient(
        135deg,
        var(--ipeka-blue),
        var(--ipeka-light)
    );

    color:white;

    text-align:center;

    padding:18px;

    border-radius:18px;

    letter-spacing:3px;

    font-weight:bold;

    box-shadow:
    0 10px 30px rgba(0,87,184,0.22);
}

/* CONTAINER */

.container{
    display:flex;
    gap:30px;
    align-items:flex-start;
    max-width:1400px;
    margin:auto;
}

/* CARD */

.seat-area,
.form-area,
.search-ticket{

    background:
    rgba(255,255,255,0.92);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.7);

    box-shadow:
    0 10px 30px rgba(0,87,184,0.08);

    border-radius:24px;
}

/* SEAT AREA */

.seat-area{
    flex:2;
    padding:28px;
    overflow:auto;
}

/* FORM AREA */

.form-area{
    flex:1;
    padding:28px;
    position:sticky;
    top:20px;
}

.form-area h2{

    margin-bottom:22px;

    color:var(--ipeka-blue);

    font-size:28px;

    font-weight:800;
}

/* LEGEND */

.legend{
    display:flex;
    gap:18px;
    margin-bottom:22px;
    flex-wrap:wrap;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
}

.legend-box{
    width:20px;
    height:20px;
    border-radius:6px;
}

.available-box{
    background:#d7e3f4;
}

.selected-box{
    background:#1db954;
}

.booked-box{
    background:#ff4d4f;
}

/* TOTAL */

.total-seat{

    margin-bottom:25px;

    font-weight:700;

    color:var(--ipeka-blue);

    font-size:17px;
}

/* ROW */

.row{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.row-label{

    width:42px;

    font-weight:bold;

    text-align:center;

    color:var(--ipeka-blue);

    font-size:18px;
}

.section{

    display:flex;
    gap:4px;
}

.aisle{
    width:20px;
}

/* SEAT */

.seat{

    width:44px;

    height:44px;

    border:none;

    border-radius:12px;

    background:#d7e3f4;

    color:#18406f;

    cursor:pointer;

    transition:0.25s;

    font-size:9px;

    font-weight:bold;

    box-shadow:
    inset 0 -2px 0 rgba(0,0,0,0.08);
}

.seat:hover{

    transform:translateY(-3px);

    background:#90caf9;
}

.selected{

    background:#1db954 !important;

    color:white;

    box-shadow:
    0 8px 18px rgba(29,185,84,0.3);
}

.booked{

    background:#ff4d4f !important;

    color:white;

    cursor:not-allowed;

    box-shadow:
    0 8px 18px rgba(255,77,79,0.25);
}

/* INPUT */

input{

    width:100%;

    padding:14px 16px;

    margin-bottom:16px;

    border:2px solid #d7e3f4;

    border-radius:14px;

    font-size:15px;

    transition:0.2s;

    background:white;
}

input:focus{

    outline:none;

    border-color:var(--ipeka-light);

    box-shadow:
    0 0 0 4px rgba(13,123,224,0.12);
}

/* BUTTON */

button{

    width:100%;

    padding:15px;

    border:none;

    background:
    linear-gradient(
        135deg,
        var(--ipeka-blue),
        var(--ipeka-light)
    );

    color:white;

    font-size:16px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

    transition:0.25s;

    box-shadow:
    0 10px 25px rgba(0,87,184,0.22);
}

button:hover{

    transform:translateY(-2px);

    opacity:0.95;
}

/* STATUS */

#status{

    margin-top:16px;

    font-size:14px;

    font-weight:bold;

    color:var(--ipeka-blue);
}

/* EMAIL NOTICE */

.email-notice{

    margin-top:20px;

    background:
    linear-gradient(
        135deg,
        #fff8e1,
        #fff3cd
    );

    border-left:6px solid var(--ipeka-orange);

    color:#5d4037;

    padding:16px;

    border-radius:16px;

    font-size:14px;

    line-height:1.8;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.05);
}

/* SEARCH */

.search-ticket{

    max-width:1400px;

    margin:35px auto;

    padding:28px;
}

.search-ticket h2{

    margin-bottom:18px;

    color:var(--ipeka-blue);

    font-size:28px;

    font-weight:800;
}

.search-box{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    align-items:center;
}

.search-box input{
    width:100%;
    flex:1;
    margin-bottom:0;
    padding:15px 18px;
    font-size:16px;
}

.search-box button{

    width:240px;

    min-width:240px;
}

/* TICKET */

.ticket-card{

    border:none;

    border-radius:22px;

    padding:24px;

    margin-top:18px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #f7fbff
    );

    box-shadow:
    0 10px 25px rgba(0,87,184,0.08);

    border-top:5px solid var(--ipeka-blue);
}

.ticket-title{

    font-size:26px;

    font-weight:800;

    color:var(--ipeka-blue);

    margin-bottom:18px;
}

.ticket-item{

    margin-bottom:12px;

    font-size:16px;

    line-height:1.7;
}

.ticket-seat{

    font-size:34px;

    color:#ff4d4f;

    font-weight:900;

    margin-top:20px;

    letter-spacing:1px;
}

/* MOBILE */

@media(max-width:1000px){

.container{
    flex-direction:column;
}

.form-area{
    width:100%;
    position:relative;
}

.search-box{
    flex-direction:column;
}

.search-box button{
    width:100%;
    min-width:100%;
}

}

/* MOBILE EXTRA */

@media(max-width:768px){

body{
    padding:14px;
}

.top-logo{
    top:12px;
    left:12px;
}

.top-logo img{
    width:55px;
    padding:6px;
}

h1{

    font-size:25px;

    line-height:1.4;

    padding-top:15px;
}

.screen{

    font-size:14px;

    padding:14px;

    letter-spacing:2px;
}

.seat-area,
.form-area,
.search-ticket{

    padding:18px;

    border-radius:20px;
}

.form-area h2,
.search-ticket h2{

    font-size:22px;
}

.row{
    overflow-x:auto;
}

.row-label{

    font-size:15px;

    width:30px;
}

.seat{

    width:34px;

    height:34px;

    font-size:8px;

    border-radius:8px;
}



.ticket-title{
    font-size:22px;
}

.ticket-item{
    font-size:14px;
}

.ticket-seat{
    font-size:24px;
}

}

</style>
</head>

<body>

<h1>Seat Booking System PENSI IPEKA Pluit Christian School</h1>

<div class="screen">
STAGE / SCREEN
</div>

<div class="container">

<div class="seat-area">

<div class="legend">

<div class="legend-item">
<div class="legend-box available-box"></div>
Available
</div>

<div class="legend-item">
<div class="legend-box selected-box"></div>
Selected
</div>

<div class="legend-item">
<div class="legend-box booked-box"></div>
Booked
</div>

</div>

<div class="total-seat">
Total Seat: 160
</div>

<div id="seatArea"></div>

</div>

<div class="form-area">

<h2>Booking Ticket</h2>

<input type="text" id="name" placeholder="Nama Lengkap">

<input type="email" id="email" placeholder="Email Pemesan">

<input type="text" id="seatCode" placeholder="Kode Kursi" readonly>

<button onclick="bookSeat()">
Booking Seat
</button>

<p id="status"></p>
<p id="status"></p>

<div class="email-notice">

📩 E-ticket akan dikirim ke email Anda.<br>

Periksa juga folder
<b>Spam / Promotions / Junk</b>
jika email belum masuk.

</div>
</div>

</div>

<!-- SEARCH TICKET -->

<div class="search-ticket">

<h2>Cari E-Ticket</h2>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Cari Nama / Booking ID / Seat">

<button onclick="searchTicket()">
Cari Ticket
</button>

</div>

<div id="ticketResult"></div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzfxxvJUBLyZms-yqfiWxFdJod6a2PrkERwErlG0t7BSvj9OrLCuwmy6AHwIDlmYy1U/exec";

const seatArea = document.getElementById("seatArea");

const rows = 10;

const layout = {
    left:4,
    center:8,
    right:4
};

let selectedSeats = [];

function generateSeats(){

    for(let r=1; r<=rows; r++){

        const rowDiv =
        document.createElement("div");

        rowDiv.className = "row";

        createSection(
            rowDiv,
            "L",
            layout.left,
            r
        );

        const aisle1 =
        document.createElement("div");

        aisle1.className = "aisle";

        rowDiv.appendChild(aisle1);

        createSection(
            rowDiv,
            "C",
            layout.center,
            r
        );

        const aisle2 =
        document.createElement("div");

        aisle2.className = "aisle";

        rowDiv.appendChild(aisle2);

        createSection(
            rowDiv,
            "R",
            layout.right,
            r
        );

        seatArea.appendChild(rowDiv);

    }

}

function createSection(parent, prefix, total, row){

    const sectionDiv =
    document.createElement("div");

    sectionDiv.className = "section";

    // TOTAL SEAT PER BLOK
    const maxPerRow = {
        L:4,
        C:8,
        R:4
    };

    // PREFIX KOLOM
    const prefixMap = {
        L:"A",
        C:"B",
        R:"C"
    };

    // NOMOR GLOBAL
    let startNumber = 0;

    // ROW sekarang (0-9)
    const rowIndex = row - 1;

    // HITUNG NOMOR BERDASARKAN KOLOM
    if(prefix === "L"){

        // A1 - A40
        startNumber = rowIndex * 4;

    }else if(prefix === "C"){

        // B1 - B80
        startNumber = rowIndex * 8;

    }else if(prefix === "R"){

        // C1 - C40
        startNumber = rowIndex * 4;

    }

    for(let i=1; i<=total; i++){

        const seat =
        document.createElement("button");

        // NOMOR GLOBAL
        const seatNumber =
        startNumber + i;

        // CODE
        const seatCode =
        `${prefixMap[prefix]}${seatNumber}`;

        seat.className = "seat";

        seat.dataset.code =
        seatCode;

        seat.innerText =
        seatCode;

        seat.onclick = () =>
        selectSeat(seat, seatCode);

        sectionDiv.appendChild(seat);

    }

    parent.appendChild(sectionDiv);

}

function selectSeat(element, code){

    if(element.classList.contains("booked")) return;

    // kalau sudah dipilih → batal pilih
    if(element.classList.contains("selected")){

        element.classList.remove("selected");

        selectedSeats =
        selectedSeats.filter(seat => seat !== code);

    }else{

        element.classList.add("selected");

        selectedSeats.push(code);

    }

    document.getElementById("seatCode").value =
    selectedSeats.join(", ");

}

async function bookSeat(){

    const name =
    document.getElementById("name")
    .value
    .trim();

    const email =
    document.getElementById("email")
    .value
    .trim();

    if(
        !name ||
        !email ||
        selectedSeats.length === 0
    ){

        alert(
        "Lengkapi data dan pilih seat!"
        );

        return;

    }

    const data = {
        action:"seat",
        name:name,
        email:email,
        seat:selectedSeats
    };

    document.getElementById("status")
    .innerText =
    "Mengirim booking...";

    try{

        const response =
        await fetch(
        "https://script.google.com/macros/s/AKfycbzfxxvJUBLyZms-yqfiWxFdJod6a2PrkERwErlG0t7BSvj9OrLCuwmy6AHwIDlmYy1U/exec",
        {
            method:"POST",
            body:JSON.stringify(data)
        });

        const result =
        await response.json();

        document.getElementById("status")
        .innerText =
        result.message;

        if(!result.success){
            return;
        }

        // ubah jadi booked
        selectedSeats.forEach(code=>{

            const seat =
            document.querySelector(
            `[data-code="${code}"]`
            );

            if(seat){

                seat.classList.remove(
                "selected"
                );

                seat.classList.add(
                "booked"
                );

            }

        });

        // reset form
        document.getElementById("name")
        .value = "";

        document.getElementById("email")
        .value = "";

        document.getElementById("seatCode")
        .value = "";

        selectedSeats = [];

    }catch(err){

        console.log(err);

        document.getElementById("status")
        .innerText =
        "Gagal booking";

    }

}

async function loadBookedSeats(){

    try{

        const response =
        await fetch("https://script.google.com/macros/s/AKfycbz4a8hzcGhH5G0Lf3J02ladZJA2StW_uPhSXTbK8wcWsXpzIlWPWxoyifWFHwoQuV3ATg/exec");

        const bookedSeats =
        await response.json();

        bookedSeats.forEach(code=>{

            const cleanCode =
            code.toString().trim();

            const seat =
            document.querySelector(
            `[data-code="${cleanCode}"]`
            );

            if(seat){

                seat.classList.add(
                "booked"
                );

            }

        });

    }catch(err){

        console.log(err);

    }

}

async function searchTicket(){

    const keyword =
    document
    .getElementById("searchInput")
    .value
    .trim();

    if(!keyword){

        alert(
        "Masukkan nama / booking ID / seat"
        );

        return;

    }

    try{

        const response =
        await fetch(

            "https://script.google.com/macros/s/AKfycbz4a8hzcGhH5G0Lf3J02ladZJA2StW_uPhSXTbK8wcWsXpzIlWPWxoyifWFHwoQuV3ATg/exec" +

            "?search=" +

            encodeURIComponent(keyword) +

            "&t=" +

            Date.now()

        );

        // DEBUG
        console.log(response);

        const result =
        await response.json();

        console.log(result);

        const ticketResult =
        document.getElementById(
        "ticketResult"
        );

        ticketResult.innerHTML = "";

        if(
            !Array.isArray(result) ||
            result.length === 0
        ){

            ticketResult.innerHTML = `

            <div class="ticket-card">

                Ticket tidak ditemukan

            </div>

            `;

            return;

        }

        result.forEach(ticket=>{

            ticketResult.innerHTML += `

            <div class="ticket-card">

                <div class="ticket-title">
                    E-Ticket Booking
                </div>

                <div class="ticket-item">
                    <b>Booking ID:</b>
                    ${ticket.bookingId}
                </div>

                <div class="ticket-item">
                    <b>Nama:</b>
                    ${ticket.name}
                </div>

                <div class="ticket-item">
                    <b>Email:</b>
                    ${ticket.email}
                </div>

                <div class="ticket-item">
                    <b>Status:</b>
                    ${ticket.status}
                </div>

                <div class="ticket-seat">
                    ${ticket.seat}
                </div>

            </div>

            `;

        });

    }catch(err){

        console.log(
        "SEARCH ERROR:",
        err
        );

        alert(
        "Gagal mengambil ticket"
        );

    }

}

generateSeats();
loadBookedSeats();

</script>

</body>
</html>
